attribute-actions:
- action: set-default
  enabled-by: true
  path: /name
  value: rtems
- action: set-default
  enabled-by: true
  path: /rtems-version
  value: '6'
- action: set-default
  enabled-by: true
  path: /prefix-directory
  value: /opt/rtems
- action: substitute
  enabled-by: true
  path: /prefix-directory
- action: set-default
  enabled-by: true
  path: /package-directory
  value: ${.:/rtems-version}
- action: set-default
  enabled-by: true
  path: /pkgversion
  value: ${.:/name}/${.:/rtems-version}
- action: set-default
  enabled-by: true
  path: /deployment-directory
  value: ${.:/prefix-directory}/${.:/package-directory}
- action: set-default
  enabled-by: true
  path: /build-directory
  value: ${.:/deployment-directory}/build
- action: set-default
  enabled-by: true
  path: /binutils-install-excludes
  value:
  - '*/info/*'
  - '*/man/*'
- action: set-default
  enabled-by: true
  path: /gcc-install-excludes
  value:
  - '*/info/*'
  - '*/man/*'
- action: set-default
  enabled-by: true
  path: /gcc-languages
  value: c,c++
- action: set
  enabled-by: pkg.feature.ada
  path: /gcc-languages
  value: ${.:/gcc-languages},ada
- action: set-default
  enabled-by: true
  path: /gcc-reported-version
  value: 13.4.0
- action: set-default
  enabled-by: true
  path: /gcc-version
  value: 13.4.0
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
enabled-by: true
enabled-set-actions:
- action: add
  enabled-by: true
  value: pkg.feature.strip-target-libraries
enabled-set-feedback-mapping: {}
links: []
pkg-type: template
template-type: component
type: pkg
